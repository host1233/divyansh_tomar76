<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Array</title>
</head>
<body>

<script>

  
    let cars = ["BMW", "Audi","range rover"];

   
    alert("Before Pop: " + cars);
    console.log("Before Pop: " + cars);

    
    cars.pop();

  
    cars.pop();


    alert("After Pop: " + cars);
    console.log("After Pop: " + cars);

</script>

</body>
