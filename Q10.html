

<!DOCTYPE html>
<html lang="en">
<head>

    <title>Array</title>
</head>
<h1>passing array to a function</h1>
<body>
    <script>
        function  country(a){
           for(let i=0;i<a.length;i++){
                alert(a[i]);
                console.log(a[i]);
                
            }
        }
        let countries=["INDIA","USA","JAPAN"];
        country(countries);

    </script>
</body>
