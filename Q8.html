<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>
<body>
    <h1>array if condition even number and odd number print</h1>
    <script>
        let a=[2,3,4,5,6,7,8,];
        for(let i=0;i<a.length;i++){
            if(a[i]%2==0){
                alert("even number : " + a[i]);
                console.log("even number : " + a[i]);
                
            }
            else{
                 alert("odd number: " + a[i]);
                console.log("odd number : " + a[i]);
                

            }
        }
    </script>
</body>
</html>
